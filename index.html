<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANTECH TZ - Jukwaa la Habari za Akili Bandia na Teknolojia Tanzania</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            950: '#09090b',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans selection:bg-emerald-500 selection:text-zinc-950 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_ARTICLES = [
            {
                id: '1',
                title: 'Serikali ya Tanzania Yaanzisha Mfumo Mpya wa Akili Bandia (AI) Katika Sekta ya Afya',
                category: 'Akili Bandia (AI)',
                summary: 'Mfumo huu mpya utasaidia madaktari vijijini kuchunguza magonjwa kwa kutumia picha za simu zilizounganishwa na AI.',
                content: 'Wizara ya Habari, Mawasiliano na Teknolojia ya Habari nchini Tanzania imetangaza kuzindua mradi kabambe wa Akili Bandia (AI) katika sekta ya afya. Mfumo huu unatumia algorithms za hali ya juu kuchambua vipimo vya afya na kuwapa wataalamu wa afya majibu ya haraka. Hii itasaidia kupunguza vifo vya akina mama na watoto na kuboresha huduma za afya maeneo ya vijijini.',
                author: 'Juma Mkwawa',
                readTime: 'Dak 4',
                likes: 342,
                views: 1250,
                imageUrl: 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=800&q=80',
                date: 'Leo, 10:30 AM'
            },
            {
                id: '2',
                title: 'Jinsi Watanzania Wanavyonufaika na Upimaji wa Coding na Programu za Simu',
                category: 'Coding & Dev',
                summary: 'Vijana wengi wa Kitanzania wanajipatia ajira za kimataifa kupitia ujuzi wa Software Engineering.',
                content: 'Sekta ya uundaji wa programu za kompyuta (Software Engineering) nchini Tanzania inazidi kuongezeka kasi. Kupitia vyuo vikuu na vituo vya mafunzo ya amali, vijana wanajifunza lugha za programu kama Python, JavaScript, na ReactJS. Hii imefungua milango ya ajira za masafa marefu (remote jobs) kwa makampuni ya Marekani na Ulaya.',
                author: 'Aisha Salum',
                readTime: 'Dak 6',
                likes: 512,
                views: 2400,
                imageUrl: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80',
                date: 'Jana'
            },
            {
                id: '3',
                title: 'Starlink Tanzania: Intaneti ya Satelaiti Yasambazwa Maeneo ya Mikoani',
                category: 'Mtandao & Usalama',
                summary: 'Kasi ya mtandao nchini inapokea mabadiliko makubwa huku maeneo ya ndani yakipata intaneti ya kasi ya juu.',
                content: 'Upatikanaji wa intaneti ya kasi ya juu kupitia satelaiti za Starlink umeleta mapinduzi makubwa nchini Tanzania. Maeneo ambayo hayakuwa na mtandao wa simu sasa yanaweza kufanya kazi mtandaoni, biashara za kielektroniki, na masomo ya mtandaoni bila kikwazo.',
                author: 'Baraka Mgosi',
                readTime: 'Dak 3',
                likes: 219,
                views: 980,
                imageUrl: 'https://images.unsplash.com/photo-1516849841032-87cbac4d88f7?auto=format&fit=crop&w=800&q=80',
                date: 'Siku 2 zilizopita'
            },
            {
                id: '4',
                title: 'Uzinduzi wa Simu Mpya za Kirafiki zenye Betri ya Siku 3 nchini TZ',
                category: 'Simu & Kompyuta',
                summary: 'Kampuni za simu zazingatia mazingira ya umeme vijijini kwa kutengeneza betri zenye uwezo mkubwa.',
                content: 'Soko la simu za mkononi nchini Tanzania limepokea toleo jipya la simu mahiri (Smartphones) zenye betri za mAh 7000 zikiwa na teknolojia ya solar charging. Simu hizi zimepata mapokezi makubwa hasa maeneo yenye changamoto ya umeme wa uhakika.',
                author: 'Devota John',
                readTime: 'Dak 5',
                likes: 184,
                views: 750,
                imageUrl: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80',
                date: 'Siku 3 zilizopita'
            }
        ];

        function App() {
            const [articles, setArticles] = useState(INITIAL_ARTICLES);
            const [selectedCategory, setSelectedCategory] = useState('Zote');
            const [searchQuery, setSearchQuery] = useState('');
            const [activeArticle, setActiveArticle] = useState(null);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            const [usdAmount, setUsdAmount] = useState(1);
            const tzsRate = 2650;
            const btcRate = 0.000015;

            const [isPlaying, setIsPlaying] = useState(false);
            const [currentSpeakingText, setCurrentSpeakingText] = useState('');
            const [playbackRate, setPlaybackRate] = useState(1);

            const [aiAnnouncement, setAiAnnouncement] = useState(
                'Habari za saa hivi kutoka SANTECH TZ! Teknolojia ya Akili Bandia (AI) inaendelea kukua kwa kasi nchini Tanzania. Wataalamu wanashauri vijana kujifunza ujuzi wa kidijitali ili kunufaika na fursa za kimataifa.'
            );

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeArticle, mobileMenuOpen, isPlaying]);

            const cleanSwahiliText = (text) => {
                return text
                    .replace(/\bAI\b/gi, 'Akili Bandia')
                    .replace(/\bTZ\b/gi, 'Tanzania')
                    .replace(/\bUSD\b/gi, 'Dola za Marekani')
                    .replace(/\bSANTECH\b/gi, 'Santech')
                    .replace(/\bBTC\b/gi, 'Bitcoin');
            };

            const handleSpeak = (textToSpeak) => {
                if (!('speechSynthesis' in window)) {
                    alert('Kivinjari chako hakiauni huduma ya kusoma sauti.');
                    return;
                }

                if (isPlaying && currentSpeakingText === textToSpeak) {
                    window.speechSynthesis.pause();
                    setIsPlaying(false);
                    return;
                }

                if (window.speechSynthesis.paused && currentSpeakingText === textToSpeak) {
                    window.speechSynthesis.resume();
                    setIsPlaying(true);
                    return;
                }

                window.speechSynthesis.cancel();

                const cleanedText = cleanSwahiliText(textToSpeak);
                const utterance = new SpeechSynthesisUtterance(cleanedText);
                utterance.lang = 'sw-TZ';
                utterance.rate = playbackRate;

                utterance.onend = () => {
                    setIsPlaying(false);
                    setCurrentSpeakingText('');
                };

                utterance.onerror = () => {
                    setIsPlaying(false);
                };

                window.speechSynthesis.speak(utterance);
                setIsPlaying(true);
                setCurrentSpeakingText(textToSpeak);
            };

            const handleStopSpeech = () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    setIsPlaying(false);
                    setCurrentSpeakingText('');
                }
            };

            const filteredArticles = articles.filter((art) => {
                const matchesCategory = selectedCategory === 'Zote' || art.category === selectedCategory;
                const matchesSearch = art.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      art.summary.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            const handleLike = (id) => {
                setArticles(articles.map(art => art.id === id ? { ...art, likes: art.likes + 1 } : art));
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        <div className="bg-emerald-950/80 border-b border-emerald-800/40 text-emerald-300 text-xs py-2 px-4 flex items-center overflow-hidden">
                            <div className="flex items-center gap-2 font-bold uppercase tracking-wider bg-emerald-500 text-zinc-950 px-2 py-0.5 rounded text-[10px] shrink-0">
                                <i data-lucide="zap" className="w-3 h-3"></i> Breaking News
                            </div>
                            <div className="ml-4 overflow-hidden whitespace-nowrap w-full">
                                <div className="animate-marquee">
                                    SANTECH TZ: Mfumo mpya wa AI wazinduliwa Afya TZ &nbsp;&bull;&nbsp; Intaneti ya Satelaiti yaenea Mikoani &nbsp;&bull;&nbsp; Pata habari za karibuni za Teknolojia kila saa!
                                </div>
                            </div>
                        </div>

                        <header className="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-amber-400 flex items-center justify-center text-zinc-950 font-black text-xl shadow-lg shadow-emerald-500/20">
                                        ST
                                    </div>
                                    <div>
                                        <h1 className="text-2xl font-black tracking-tight font-serif bg-gradient-to-r from-zinc-100 via-zinc-200 to-emerald-400 bg-clip-text text-transparent">
                                            SANTECH<span className="text-emerald-500 text-sm font-sans ml-1">TZ</span>
                                        </h1>
                                        <p className="text-[10px] text-zinc-400 font-medium tracking-wide uppercase">Habari za AI na Teknolojia Tanzania</p>
                                    </div>
                                </div>

                                <nav className="hidden md:flex items-center gap-6 text-sm font-medium text-zinc-400">
                                    {['Zote', 'Akili Bandia (AI)', 'Coding & Dev', 'Simu & Kompyuta', 'Mtandao & Usalama'].map((cat) => (
                                        <button
                                            key={cat}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`transition-colors hover:text-emerald-400 ${
                                                selectedCategory === cat ? 'text-emerald-400 font-semibold border-b-2 border-emerald-500 pb-1' : ''
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </nav>

                                <div className="hidden sm:flex items-center gap-3">
                                    <a
                                        href="https://wa.me/255700000000"
                                        target="_blank"
                                        rel="noreferrer"
                                        className="flex items-center gap-2 bg-emerald-600/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500 hover:text-zinc-950 px-4 py-2 rounded-xl text-xs font-semibold transition-all shadow-sm"
                                    >
                                        <i data-lucide="message-circle" className="w-4 h-4"></i> WhatsApp Us
                                    </a>
                                </div>

                                <button 
                                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                    className="md:hidden p-2 text-zinc-400 hover:text-zinc-100"
                                >
                                    <i data-lucide="menu" className="w-6 h-6"></i>
                                </button>
                            </div>

                            {mobileMenuOpen && (
                                <div className="md:hidden bg-zinc-900 border-b border-zinc-800 px-4 py-4 space-y-3">
                                    {['Zote', 'Akili Bandia (AI)', 'Coding & Dev', 'Simu & Kompyuta', 'Mtandao & Usalama'].map((cat) => (
                                        <button
                                            key={cat}
                                            onClick={() => {
                                                setSelectedCategory(cat);
                                                setMobileMenuOpen(false);
                                            }}
                                            className="block w-full text-left py-2 text-sm text-zinc-300 hover:text-emerald-400"
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </header>

                        <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">
                            <section className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-zinc-900 via-zinc-900/90 to-emerald-950/40 border border-emerald-500/20 p-6 sm:p-8 shadow-2xl">
                                <div className="relative z-10 space-y-4">
                                    <div className="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-emerald-400">
                                        <i data-lucide="radio" className="w-4 h-4 text-emerald-400"></i> Tangazo la AI la Saa Hii (SANTECH Gemini AI)
                                    </div>

                                    <p className="text-zinc-200 text-base sm:text-lg leading-relaxed font-serif max-w-4xl">
                                        "{aiAnnouncement}"
                                    </p>

                                    <div className="flex flex-wrap items-center gap-4 pt-2">
                                        <button
                                            onClick={() => handleSpeak(aiAnnouncement)}
                                            className="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 px-5 py-2.5 rounded-xl text-xs font-bold transition-all shadow-lg shadow-emerald-500/20 active:scale-95"
                                        >
                                            <i data-lucide={isPlaying && currentSpeakingText === aiAnnouncement ? "pause" : "volume-2"} className="w-4 h-4"></i>
                                            {isPlaying && currentSpeakingText === aiAnnouncement ? "Simamisha Sauti" : "Sikiliza Tangazo la AI (Kiswahili)"}
                                        </button>

                                        {isPlaying && (
                                            <button
                                                onClick={handleStopSpeech}
                                                className="flex items-center gap-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2.5 rounded-xl text-xs font-medium transition-all"
                                            >
                                                <i data-lucide="square" className="w-4 h-4 text-rose-400"></i> Komesha
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </section>

                            <section className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="md:col-span-2 bg-zinc-900/60 border border-zinc-800 rounded-2xl p-6 flex flex-col justify-between space-y-4">
                                    <div>
                                        <h3 className="text-lg font-bold text-zinc-100 flex items-center gap-2">
                                            <i data-lucide="dollar-sign" className="w-5 h-5 text-emerald-400"></i> Kigeuzi cha Fedha za Teknolojia (USD / TZS / BTC)
                                        </h3>
                                        <p className="text-xs text-zinc-400 mt-1">
                                            Badilisha viwango vya kubadilisha fedha kwa ajili ya manunuzi ya vifaa vya kidijitali na huduma za mtandaoni.
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                                        <div>
                                            <label className="text-[11px] font-semibold text-zinc-400 uppercase">Dola (USD)</label>
                                            <input
                                                type="number"
                                                value={usdAmount}
                                                onChange={(e) => setUsdAmount(Number(e.target.value) || 0)}
                                                className="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-emerald-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="text-[11px] font-semibold text-zinc-400 uppercase">Shilingi (TZS)</label>
                                            <div className="mt-1 w-full bg-zinc-950/80 border border-zinc-800/80 rounded-xl px-3 py-2 text-sm text-emerald-400 font-mono">
                                                {(usdAmount * tzsRate).toLocaleString()} TZS
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[11px] font-semibold text-zinc-400 uppercase">Bitcoin (BTC)</label>
                                            <div className="mt-1 w-full bg-zinc-950/80 border border-zinc-800/80 rounded-xl px-3 py-2 text-sm text-amber-400 font-mono">
                                                {(usdAmount * btcRate).toFixed(6)} BTC
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-gradient-to-br from-zinc-900 to-zinc-900/50 border border-zinc-800 rounded-2xl p-6 flex flex-col justify-center space-y-3">
                                    <div className="flex items-center gap-2 text-amber-400 font-semibold text-sm">
                                        <i data-lucide="trending-up" className="w-4 h-4"></i> Rate za Leo Tanzania
                                    </div>
                                    <div className="text-2xl font-black text-zinc-100 font-mono">
                                        1 USD = <span className="text-emerald-400">2,650 TZS</span>
                                    </div>
                                    <p className="text-xs text-zinc-400">
                                        Inajumuisha ada za kawaida za miamala ya benki za Tanzania na kadi za mtandaoni.
                                    </p>
                                </div>
                            </section>

                            <section className="flex flex-col sm:flex-row gap-4 items-center justify-between pt-4">
                                <div className="relative w-full sm:w-80">
                                    <input
                                        type="text"
                                        placeholder="Tafuta habari za AI, Simu, Coding..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-4 pr-4 py-2.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 transition-all"
                                    />
                                </div>

                                <div className="flex items-center gap-2 text-xs text-zinc-400 self-start sm:self-auto">
                                    <span>Spidi ya Sauti:</span>
                                    {[0.75, 1, 1.25, 1.5].map((rate) => (
                                        <button
                                            key={rate}
                                            onClick={() => setPlaybackRate(rate)}
                                            className={`px-2 py-1 rounded-lg text-[10px] font-bold border ${
                                                playbackRate === rate
                                                    ? 'bg-emerald-500/10 border-emerald-500 text-emerald-400'
                                                    : 'border-zinc-800 text-zinc-400 hover:border-zinc-700'
                                            }`}
                                        >
                                            {rate}x
                                        </button>
                                    ))}
                                </div>
                            </section>

                            <section className="space-y-6">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-xl font-bold font-serif text-zinc-100 flex items-center gap-2">
                                        <i data-lucide="book-open" className="w-5 h-5 text-emerald-500"></i> Makala na Habari za Teknolojia
                                    </h2>
                                    <span className="text-xs text-zinc-500">{filteredArticles.length} Habari zimepatikana</span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {filteredArticles.map((article) => (
                                        <article
                                            key={article.id}
                                            className="bg-zinc-900/50 border border-zinc-800/80 rounded-2xl overflow-hidden hover:border-zinc-700 transition-all group flex flex-col justify-between"
                                        >
                                            <div>
                                                <div className="relative h-48 overflow-hidden">
                                                    <img
                                                        src={article.imageUrl}
                                                        alt={article.title}
                                                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                                                    />
                                                    <span className="absolute top-3 left-3 bg-zinc-950/80 backdrop-blur-md border border-zinc-800 text-emerald-400 text-[10px] font-semibold px-2.5 py-1 rounded-lg">
                                                        {article.category}
                                                    </span>
                                                </div>

                                                <div className="p-5 space-y-3">
                                                    <div className="flex items-center gap-3 text-[11px] text-zinc-500">
                                                        <span>{article.author}</span>
                                                        &bull;
                                                        <span>{article.readTime}</span>
                                                        &bull;
                                                        <span>{article.date}</span>
                                                    </div>

                                                    <h3 
                                                        onClick={() => setActiveArticle(article)}
                                                        className="text-lg font-bold font-serif text-zinc-100 group-hover:text-emerald-400 transition-colors cursor-pointer leading-snug"
                                                    >
                                                        {article.title}
                                                    </h3>

                                                    <p className="text-xs text-zinc-400 leading-relaxed line-clamp-2">
                                                        {article.summary}
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="p-5 pt-0 border-t border-zinc-800/40 mt-4 flex items-center justify-between text-xs text-zinc-400">
                                                <div className="flex items-center gap-4">
                                                    <button
                                                        onClick={() => handleLike(article.id)}
                                                        className="flex items-center gap-1 hover:text-emerald-400 transition-colors"
                                                    >
                                                        <i data-lucide="thumbs-up" className="w-3.5 h-3.5"></i> {article.likes}
                                                    </button>

                                                    <span className="flex items-center gap-1 text-zinc-500">
                                                        <i data-lucide="eye" className="w-3.5 h-3.5"></i> {article.views}
                                                    </span>
                                                </div>

                                                <div className="flex items-center gap-2">
                                                    <button
                                                        onClick={() => handleSpeak(article.content)}
                                                        className="p-2 rounded-lg bg-zinc-800/80 hover:bg-emerald-500 hover:text-zinc-950 text-emerald-400 transition-all"
                                                        title="Sikiliza Habari Hii"
                                                    >
                                                        <i data-lucide="volume-2" className="w-4 h-4"></i>
                                                    </button>

                                                    <button
                                                        onClick={() => setActiveArticle(article)}
                                                        className="flex items-center gap-1 text-xs font-semibold text-emerald-400 hover:text-emerald-300"
                                                    >
                                                        Soma &rarr;
                                                    </button>
                                                </div>
                                            </div>
                                        </article>
                                    ))}
                                </div>
                            </section>
                        </main>
                    </div>

                    {activeArticle && (
                        <div className="fixed inset-0 z-50 bg-zinc-950/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-2xl w-full p-6 sm:p-8 space-y-6 relative my-8">
                                <button
                                    onClick={() => setActiveArticle(null)}
                                    className="absolute top-4 right-4 p-2 text-zinc-400 hover:text-zinc-100 bg-zinc-800 rounded-full"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">
                                    {activeArticle.category}
                                </span>

                                <h2 className="text-2xl font-bold font-serif text-zinc-100 leading-snug">
                                    {activeArticle.title}
                                </h2>

                                <div className="flex items-center gap-4 text-xs text-zinc-400 border-b border-zinc-800 pb-4">
                                    <span>Mwandishi: {activeArticle.author}</span>
                                    &bull;
                                    <span>{activeArticle.date}</span>
                                </div>

                                <img
                                    src={activeArticle.imageUrl}
                                    alt={activeArticle.title}
                                    className="w-full h-60 object-cover rounded-2xl"
                                />

                                <p className="text-zinc-300 text-sm leading-relaxed whitespace-pre-line">
                                    {activeArticle.content}
                                </p>

                                <div className="flex items-center justify-between pt-4 border-t border-zinc-800">
                                    <button
                                        onClick={() => handleSpeak(activeArticle.content)}
                                        className="flex items-center gap-2 bg-emerald-500 text-zinc-950 px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-400 transition-all"
                                    >
                                        <i data-lucide="volume-2" className="w-4 h-4"></i> Sikiliza Makala Hii
                                    </button>

                                    <button
                                        onClick={() => {
                                            navigator.clipboard.writeText(window.location.href);
                                            alert('Link ya makala imenakiliwa!');
                                        }}
                                        className="flex items-center gap-2 text-xs text-zinc-400 hover:text-zinc-100"
                                    >
                                        <i data-lucide="share-2" className="w-4 h-4"></i> Sambaza
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-zinc-950 border-t border-zinc-900 py-8 mt-12 text-center text-xs text-zinc-500">
                        <div className="max-w-7xl mx-auto px-4 space-y-2">
                            <p className="font-semibold text-zinc-400">&copy; {new Date().getFullYear()} SANTECH TZ. Haki zote zimehifadhiwa.</p>
                            <p>Jukwaa la Habari za Akili Bandia na Teknolojia Tanzania.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
